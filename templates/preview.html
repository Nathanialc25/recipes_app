{% extends "base.html" %}

{% block title %}Preview — GoodEats {% endblock %}

{% block content %}

<div class="mb-6">
  <a href="{{ url_for('convert') }}"
     class="text-sm text-neutral-500 hover:text-neutral-900">
    ← Try another
  </a>
</div>

<h1 class="text-2xl font-bold mb-6">Preview</h1>

<form method="POST" action="{{ url_for('preview_save') }}" class="space-y-6">

  <!-- Name -->
  <label class="block">
    <span class="text-sm font-medium text-neutral-700">Recipe name</span>
    <input type="text" name="name" required
           value="{{ recipe.name or '' }}"
           class="mt-1 w-full border border-neutral-300 rounded-lg px-3 py-2 focus:outline-none focus:border-neutral-900">
  </label>

  <!-- Times + servings -->
  <div class="flex gap-4">
    <label class="block flex-1">
      <span class="text-sm font-medium text-neutral-700">Prep time</span>
      <input type="text" name="prep_time"
             value="{{ recipe.prep_time or '' }}"
             class="mt-1 w-full border border-neutral-300 rounded-lg px-3 py-2 focus:outline-none focus:border-neutral-900">
    </label>
    <label class="block flex-1">
      <span class="text-sm font-medium text-neutral-700">Cook time</span>
      <input type="text" name="cook_time"
             value="{{ recipe.cook_time or '' }}"
             class="mt-1 w-full border border-neutral-300 rounded-lg px-3 py-2 focus:outline-none focus:border-neutral-900">
    </label>
  </div>

  <label class="block">
    <span class="text-sm font-medium text-neutral-700">Servings</span>
    <input type="text" name="servings"
           value="{{ recipe.servings or '' }}"
           class="mt-1 w-full border border-neutral-300 rounded-lg px-3 py-2 focus:outline-none focus:border-neutral-900">
  </label>

  <!-- Ingredients -->
  <div>
    <span class="text-sm font-medium text-neutral-700 block mb-2">Ingredients</span>
    <div class="space-y-2">
      {% for ing in recipe.ingredients %}
      <div class="flex gap-2">
        <input type="text" name="ingredients" value="{{ ing }}"
               class="flex-1 border border-neutral-300 rounded-lg px-3 py-2 focus:outline-none focus:border-neutral-900">
        <button type="button" onclick="this.parentElement.remove()"
                class="text-neutral-400 hover:text-red-600 px-2">✕</button>
      </div>
      {% endfor %}
    </div>
  </div>

  <!-- Instructions -->
  <div>
    <span class="text-sm font-medium text-neutral-700 block mb-2">Instructions</span>
    <div class="space-y-2">
      {% for step in recipe.instructions %}
      <div class="flex gap-2 items-start">
        <textarea name="instructions" rows="2"
                  class="flex-1 border border-neutral-300 rounded-lg px-3 py-2 focus:outline-none focus:border-neutral-900">{{ step }}</textarea>
        <button type="button" onclick="this.parentElement.remove()"
                class="text-neutral-400 hover:text-red-600 px-2 pt-2">✕</button>
      </div>
      {% endfor %}
    </div>
  </div>

  <!-- Save / cancel -->
  <div class="flex gap-3 pt-2">
    <a href="{{ url_for('convert') }}"
       class="flex-1 text-center border border-neutral-300 py-3 rounded-full font-medium hover:bg-neutral-100 transition">
      Cancel
    </a>
    <button type="submit"
            class="flex-1 bg-neutral-900 text-white py-3 rounded-full font-medium hover:bg-neutral-700 transition">
      Save
    </button>
  </div>

</form>

{% endblock %}
