{% extends "base.html" %}

{% block title %}Preview — GoodEats{% endblock %}

{% block content %}

<div class="mb-6">
  <a href="{{ url_for('convert') }}"
     class="text-sm text-stone-500 hover:text-stone-900">
    ← Try another
  </a>
</div>

<h1 class="text-2xl font-semibold tracking-tight mb-6">Review recipe</h1>

<form method="POST" action="{{ url_for('preview_save') }}" class="space-y-5">

  <div>
    <label class="block text-sm font-medium text-stone-700 mb-1.5">Recipe name</label>
    <input type="text" name="name" required
           value="{{ recipe.name or '' }}"
           class="w-full border border-stone-300 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-700 focus:ring-1 focus:ring-emerald-700">
  </div>

  <div class="flex gap-3">
    <div class="flex-1">
      <label class="block text-sm font-medium text-stone-700 mb-1.5">Prep time</label>
      <input type="text" name="prep_time"
             value="{{ recipe.prep_time or '' }}"
             class="w-full border border-stone-300 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-700 focus:ring-1 focus:ring-emerald-700">
    </div>
    <div class="flex-1">
      <label class="block text-sm font-medium text-stone-700 mb-1.5">Cook time</label>
      <input type="text" name="cook_time"
             value="{{ recipe.cook_time or '' }}"
             class="w-full border border-stone-300 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-700 focus:ring-1 focus:ring-emerald-700">
    </div>
  </div>

  <div>
    <label class="block text-sm font-medium text-stone-700 mb-1.5">Servings</label>
    <input type="text" name="servings"
           value="{{ recipe.servings or '' }}"
           class="w-full border border-stone-300 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-700 focus:ring-1 focus:ring-emerald-700">
  </div>

  <!-- Ingredients -->
  <div class="border-t border-stone-200 pt-5">
    <h2 class="text-sm font-medium text-stone-500 uppercase tracking-wide mb-3">Ingredients</h2>
    <div class="space-y-2">
      {% for ing in recipe.ingredients %}
      <div class="flex gap-2 items-start">
        <input type="text" name="ingredients" value="{{ ing }}"
               class="flex-1 border border-stone-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-700 focus:ring-1 focus:ring-emerald-700">
        <button type="button" onclick="this.parentElement.remove()"
                class="text-stone-400 hover:text-red-600 px-2 py-2.5 text-sm">✕</button>
      </div>
      {% endfor %}
    </div>
  </div>

  <!-- Instructions -->
  <div class="border-t border-stone-200 pt-5">
    <h2 class="text-sm font-medium text-stone-500 uppercase tracking-wide mb-3">Instructions</h2>
    <div class="space-y-2">
      {% for step in recipe.instructions %}
      <div class="flex gap-2 items-start">
        <textarea name="instructions" rows="2"
                  class="flex-1 border border-stone-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-700 focus:ring-1 focus:ring-emerald-700">{{ step }}</textarea>
        <button type="button" onclick="this.parentElement.remove()"
                class="text-stone-400 hover:text-red-600 px-2 py-2 text-sm">✕</button>
      </div>
      {% endfor %}
    </div>
  </div>

  <div class="flex gap-3 pt-2">
    <a href="{{ url_for('convert') }}"
       class="flex-1 text-center border border-stone-300 py-3.5 rounded-xl font-medium text-stone-700 hover:bg-stone-100 transition">
      Cancel
    </a>
    <button type="submit"
            class="flex-1 bg-emerald-700 text-white py-3.5 rounded-xl font-medium hover:bg-emerald-800 transition">
      Save
    </button>
  </div>

</form>

{% endblock %}
